<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">
    <style>
        body{
            min-height: 100vh;
            background-image: linear-gradient(to bottom, #141c2b, #0a0f19);
        }
        .logo{
            height: 70px;
            width: auto;
        }
        .navLinks{
            font-size: 1.2rem;
        }
        .featuredGame {
            background: linear-gradient(to right, rgba(10, 15, 25, 0.9), rgba(10, 15, 25, 0.3)), url('images/arcRaidersAlternative.jpg') center/cover no-repeat;
            min-height: 500px; 
            border-radius: 12px; 
        }
    </style>
</head>
<body>
    <!---For the navigation bar-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid my-2">
            <a class="navbar-brand" href="#"><img src="images/reviewLogoNav.png" alt="LOGO" class="logo img-fluid px-3"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav navLinks">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                    <a class="nav-link" href="#">Reviews</a>
                    <a class="nav-link" href="#">Recommendations</a>
                </div>
                <form class="d-flex px-lg-4 flex-grow-1" role="search">
                    <input class="form-control" type="search" placeholder="Search" name="searchbar" aria-label="Search"/>
                </form>
                <div class="d-flex pt-2 pt-lg-0 gap-2">
                    <button class="btn btn-outline-light">Sign up</button>
                    <button class="btn btn-light">Login</button>
                </div>
            </div>
        </div>
    </nav>
    <!--Featured Game Here-->
    <section class="py-5">
        <div class="container">
            <div class="featuredGame text-white d-flex align-items-center">
                <div class="conten px-5">
                    <p>Featured Game</p>
                    <h1 class="display-4 fw-bold">Arc Raiders</h1>
                    <div class="mb-3 text-warning">
                        ★★★★★
                    </div>
                    <p>Short description of the featured game review</p>
                    <a href="#" class="btn btn-primary mt-3">Read Review</a>
                </div>
            </div>
        </div>
    </section>
    

    <!--The footer-->
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
    crossorigin="anonymous"></script>
</body>
</html>
